<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚽ Soccer Game</h1>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="info">
            <p>Score: <span id="score">0</span> | Ball Touches: <span id="touches">0</span></p>
            <p>Arrow Keys to Move | Space to Kick</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
